; LoRa modem: STM32 Black Pill (F401CC) + Ra-02 (SX1278). Derleme: pio run -d firmware
; Yükleme (DFU, BOOT0 basılıyken NRST): pio run -d firmware -t upload
; Radyo ayarları config/settings.py SYNC['RADIO'] ile aynı olmalı (yayın süresi hesabı).
[env:blackpill]
platform = ststm32@20.0.0
board = blackpill_f401cc
framework = arduino
upload_protocol = dfu
lib_deps = sandeepmistry/LoRa@0.8.0
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC  ; USB seri (COM portu); USBCON'u framework kendisi ekler
    -D LORA_FREQ=434500000
    -D LORA_SF=7
    -D LORA_BW=125000
    -D LORA_CR=5
    -D LORA_PREAMBLE=8
    -D LORA_SYNC=0x5A
    -D LORA_POWER=10
