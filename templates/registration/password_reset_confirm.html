{% extends "base.html" %}
{% block title %}Yeni şifre · {% endblock %}
{% block content %}
{% if validlink %}
  <h1>Yeni şifreni belirle</h1>
  <form method="post">{% csrf_token %}{{ form }}<button class="primary">Şifreyi kaydet</button></form>
{% else %}
  <h1>Bağlantı geçersiz</h1>
  <p>Bağlantı kullanılmış ya da süresi dolmuş. <a href="{% url 'password_reset' %}">Yeni bağlantı iste</a>.</p>
{% endif %}
{% endblock %}
