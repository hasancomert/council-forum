{# ▲ puan ▼ formu (yorum ve konu). Değişkenler: url, score, mine (1, −1 ya da 0); işlemden sonra next'e dönülür #}
<form method="post" action="{{ url }}" class="vote">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button name="value" value="1" title="Artı oy" aria-label="Artı oy" aria-pressed="{% if mine == 1 %}true{% else %}false{% endif %}">▲</button>
  <output title="puan">{{ score }}</output>
  <button name="value" value="-1" title="Eksi oy" aria-label="Eksi oy" aria-pressed="{% if mine == -1 %}true{% else %}false{% endif %}">▼</button>
</form>
