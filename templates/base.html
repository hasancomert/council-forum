<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if title %}{{ title }} · {% endif %}Forum</title>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}">Forum</a>
    {% if user.is_authenticated %}
      {{ user.username }}
      <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button>Çıkış</button></form>
    {% else %}
      <a href="{% url 'login' %}">Giriş</a> <a href="{% url 'signup' %}">Kayıt ol</a>
    {% endif %}
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
